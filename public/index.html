<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART OFFICE CONTROLLER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 900px; background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 16px; margin-bottom: 20px; }
        .title h1 { color: #38bdf8; font-size: 24px; }
        .status-badge { background: #22c55e; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        
        .auto-box { background: #0f172a; border: 2px solid #38bdf8; padding: 16px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .auto-box.manual-mode { border-color: #f59e0b; }
        .auto-title { font-size: 16px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .auto-box.manual-mode .auto-title { color: #f59e0b; }
        .mode-tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #38bdf8; color: #0f172a; font-weight: 800; }
        .auto-box.manual-mode .mode-tag { background: #f59e0b; color: #0f172a; }
        .auto-desc { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        .master-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .btn-master { padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-on { background-color: #06b6d4; color: white; }
        .btn-off { background-color: #ef4444; color: white; }
        .btn-master:hover { opacity: 0.9; transform: translateY(-2px); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; transition: 0.3s; }
        .card.active { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .card.locked { opacity: 0.75; }
        .card-icon { font-size: 40px; margin-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .card-sub { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
        
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #38bdf8; }
        input:checked + .slider:before { transform: translateX(26px); }
        input:disabled + .slider { cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <h1>🏢 SMART OFFICE CONTROLLER</h1>
            </div>
            <div id="status" class="status-badge">กำลังเชื่อมต่อ...</div>
        </div>

        <!-- แถบควบคุมโหมดอัตโนมัติ / แมนนวล -->
        <div class="auto-box" id="auto-box">
            <div>
                <div class="auto-title">
                    <span id="mode-icon">⏰</span> 
                    <span id="mode-text">โหมดทำงานอัตโนมัติ (Auto Schedule)</span>
                    <span class="mode-tag" id="mode-tag">AUTO</span>
                </div>
                <div class="auto-desc" id="mode-desc">เปิด-ปิด Air 1 และ Air 2 อัตโนมัติตามช่วงเวลา 08:00 - 16:00 น.</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="auto-toggle" onchange="toggleAuto(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="master-controls">
            <button class="btn-master btn-on" onclick="controlAll(true)">เปิดอุปกรณ์ทั้งหมด</button>
            <button class="btn-master btn-off" onclick="controlAll(false)">ปิดอุปกรณ์ทั้งหมด</button>
        </div>

        <div class="grid">
            <!-- Channel 0: Air 1 -->
            <div class="card" id="card-0">
                <div class="card-icon">❄️</div>
                <div class="card-title">Air 1</div>
                <div class="card-sub">25,000 BTU</div>
                <label class="switch">
                    <input type="checkbox" id="toggle-0" onchange="toggleRelay(0, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Channel 1: Air 2 -->
            <div class="card" id="card-1">
                <div class="card-icon">❄️</div>
                <div class="card-title">Air 2</div>
                <div class="card-sub">25,000 BTU</div>
                <label class="switch">
                    <input type="checkbox" id="toggle-1" onchange="toggleRelay(1, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Channel 2: Air 3 -->
            <div class="card" id="card-2">
                <div class="card-icon">❄️</div>
                <div class="card-title">Air 3</div>
                <div class="card-sub">53,000 BTU</div>
                <label class="switch">
                    <input type="checkbox" id="toggle-2" onchange="toggleRelay(2, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Channel 3: Motor Pump -->
            <div class="card" id="card-3">
                <div class="card-icon">🚰</div>
                <div class="card-title">Motor Pump</div>
                <div class="card-sub">300 W</div>
                <label class="switch">
                    <input type="checkbox" id="toggle-3" onchange="toggleRelay(3, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/esp`;
        let ws;
        let reconnectTimer;

        function updateModeUI(isAuto) {
            const autoBox = document.getElementById('auto-box');
            const modeText = document.getElementById('mode-text');
            const modeTag = document.getElementById('mode-tag');
            const modeDesc = document.getElementById('mode-desc');
            const modeIcon = document.getElementById('mode-icon');

            // ปุ่ม Air 1 และ Air 2 จะกดเองไม่ได้ขณะอยู่โหมด AUTO (ต้องสลับเป็น MANUAL ก่อนจึงจะปรับอิสระได้)
            const toggle0 = document.getElementById('toggle-0');
            const toggle1 = document.getElementById('toggle-1');
            const card0 = document.getElementById('card-0');
            const card1 = document.getElementById('card-1');

            if (isAuto) {
                autoBox.classList.remove('manual-mode');
                modeIcon.innerText = '⏰';
                modeText.innerText = 'โหมดทำงานอัตโนมัติ (Auto Schedule)';
                modeTag.innerText = 'AUTO';
                modeDesc.innerText = 'ระบบกำลังควบคุม Air 1 และ Air 2 ตามตารางเวลา (ปิดสวิตช์ด้านขวาเพื่อสลับเป็น Manual)';
                toggle0.disabled = true;
                toggle1.disabled = true;
                card0.classList.add('locked');
                card1.classList.add('locked');
            } else {
                autoBox.classList.add('manual-mode');
                modeIcon.innerText = '🖐️';
                modeText.innerText = 'โหมดควบคุมเอง (Manual Mode)';
                modeTag.innerText = 'MANUAL';
                modeDesc.innerText = 'ค้างสถานะการทำงานตามที่เลือกไว้ สามารถเปิด-ปิดอุปกรณ์ทุกตัวได้อิสระ';
                toggle0.disabled = false;
                toggle1.disabled = false;
                card0.classList.remove('locked');
                card1.classList.remove('locked');
            }
        }

        function connectWS() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status').innerText = 'ออนไลน์';
                document.getElementById('status').style.background = '#22c55e';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'INIT_STATE') {
                    if (data.autoMode !== undefined) {
                        document.getElementById('auto-toggle').checked = data.autoMode;
                        updateModeUI(data.autoMode);
                    }
                    if (Array.isArray(data.relays)) {
                        data.relays.forEach((state, i) => {
                            const toggle = document.getElementById(`toggle-${i}`);
                            const card = document.getElementById(`card-${i}`);
                            if (toggle) {
                                toggle.checked = state;
                                card.classList.toggle('active', state);
                            }
                        });
                    }
                }
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = 'ออฟไลน์';
                document.getElementById('status').style.background = '#ef4444';
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connectWS, 2000);
            };
        }

        // เมื่อเปิดหน้าจอมือถือขึ้นมาใหม่ ให้เชื่อมต่อใหม่ทันทีเพื่อซิงค์สถานะที่ค้างไว้
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connectWS();
                }
            }
        });

        function toggleRelay(ch, state) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'CONTROL', ch: ch, state: state }));
            }
        }

        function controlAll(state) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                // หากสั่งเปิด/ปิดทั้งหมด ให้สลับเป็นโหมด Manual อัตโนมัติเพื่อให้ค้างสถานะที่สั่งไว้
                if (document.getElementById('auto-toggle').checked) {
                    ws.send(JSON.stringify({ type: 'TOGGLE_AUTO', state: false }));
                }
                ws.send(JSON.stringify({ type: 'CONTROL_ALL', state: state }));
            }
        }

        function toggleAuto(state) {
            updateModeUI(state);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'TOGGLE_AUTO', state: state }));
            }
        }

        connectWS();
    </script>
</body>
</html>
